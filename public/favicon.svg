<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Circular dark badge matching uploaded symbol -->
  <circle cx="32" cy="32" r="30" fill="#161618" stroke="#2A2A2E" stroke-width="2"/>
  <circle cx="32" cy="32" r="28" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Main outlined 4-pointed sparkle star centered symmetrically at (32, 32) -->
  <path
    d="M 32 15.5
       C 32 24.5, 24.5 32, 15.5 32
       C 24.5 32, 32 39.5, 32 48.5
       C 32 39.5, 39.5 32, 48.5 32
       C 39.5 32, 32 24.5, 32 15.5 Z"
    fill="#161618"
    stroke="#F4F4F5"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top-right secondary 4-point sparkle -->
  <path
    d="M 45.5 15
       C 45.5 18.2, 43.2 20.5, 40 20.5
       C 43.2 20.5, 45.5 22.8, 45.5 26
       C 45.5 22.8, 47.8 20.5, 51 20.5
       C 47.8 20.5, 45.5 18.2, 45.5 15 Z"
    fill="#E4E4E7"
  />

  <!-- Bottom-left small hollow ring -->
  <circle cx="19.5" cy="43.5" r="3.4" stroke="#E4E4E7" stroke-width="2.2" fill="#161618"/>
</svg>
